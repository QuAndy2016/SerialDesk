name: Build & Release Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # Pinned via constraints.txt so the bundle is the same on every build;
          # constraints cap versions without installing anything on their own.
          pip install -r requirements.txt -c constraints.txt
          pip install pyinstaller -c constraints.txt

      # Runs BEFORE the build, so a red test never reaches the installer or a release.
      # Offscreen + UTF-8 because the UI tests build real widgets headlessly.
      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m pytest -q

      # Dependency check (SSDF PW: reuse well-secured components). Deliberately not part of
      # the local gate: pip-audit resolves against PyPI/OSV, which did not finish on a slow
      # link (measured: 226 s with no output, and 80 s with only warnings), while a CI runner
      # reaches the advisory services quickly. Audits the pinned build set from constraints.txt.
      - name: Audit dependencies
        run: |
          pip install pip-audit
          python -m pip_audit --vulnerability-service osv --no-deps -r constraints.txt

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from app import __version__; print(__version__)"
          echo "version=$v" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.ver.outputs.version }}"
          if ($tag -ne "v$ver") {
            Write-Error "Tag '$tag' does not match app.__version__ 'v$ver'. Bump app/__init__.py or fix the tag."
            exit 1
          }
          Write-Host "Tag $tag matches app version v$ver"

      # onedir (not onefile): the onefile self-extracting bootloader is a known
      # trigger for Microsoft Defender / SmartScreen false positives.
      - name: Build EXE with PyInstaller (onedir)
        run: |
          $exe = "SerialDesk_v${{ steps.ver.outputs.version }}"
          pyinstaller --noconfirm --clean --windowed --onedir --name $exe --icon assets/icon.ico `
            --add-data "assets;assets" `
            --exclude-module tkinter --exclude-module unittest --exclude-module pydoc `
            --exclude-module doctest --exclude-module pytest --exclude-module setuptools `
            --exclude-module pip --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            main.py

      # the PySide6 runtime ships pieces this app never touches; dropping them
      # cuts the download roughly in half (QML/Quick/PDF engines, the software
      # OpenGL fallback and Qt's own translations).
      - name: Slim the bundle
        shell: pwsh
        run: |
          $dir = "dist\SerialDesk_v${{ steps.ver.outputs.version }}"
          $before = [math]::Round((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          foreach ($f in @(
              "_internal\PySide6\opengl32sw.dll",
              "_internal\PySide6\Qt6Qml.dll",
              "_internal\PySide6\Qt6Quick.dll",
              "_internal\PySide6\Qt6Pdf.dll")) {
            $p = Join-Path $dir $f
            if (Test-Path $p) { Remove-Item $p -Force; Write-Host "removed $f" }
          }
          foreach ($d in @("_internal\PySide6\qml", "_internal\PySide6\translations")) {
            $p = Join-Path $dir $d
            if (Test-Path $p) { Remove-Item $p -Recurse -Force; Write-Host "removed $d" }
          }
          $after = [math]::Round((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "bundle size: $before MB -> $after MB"

      - name: Package release zip
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.version }}"
          $name = "SerialDesk_v$ver"
          $pkg  = "dist\pkg\$name"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Path "dist\$name\*" -Destination $pkg -Recurse -Force

          $lines = @(
            "SerialDesk v$ver - Windows 64-bit",
            "",
            "用法 / Usage",
            "  1. 解压本压缩包到任意目录（不要只把 exe 单独拷出来，同目录的文件夹是运行库）",
            "  2. 双击 $name\$name.exe 运行，无需安装 Python",
            "",
            "首次运行被 Windows 拦下时 / If Windows blocks the first run",
            "  - SmartScreen 弹窗：点「更多信息」→「仍要运行」",
            "  - Edge 下载被拦：下载面板 → 该文件右侧 ... → 保留",
            "  - 若提示文件被锁定：右键 exe → 属性 → 勾选「解除锁定」→ 确定",
            "",
            "配置与日志 / Settings and logs",
            "  配置(config.json)与日志保存在 %APPDATA%\SerialDesk；若在同目录放一个空的",
            "  portable.txt，则改为保存在程序所在目录（便携模式）。",
            "",
            "校验 / Checksum",
            "  同目录的 .sha256 文件是本压缩包的 SHA256，可用 certutil -hashfile 校验。",
            "",
            "项目主页 / Homepage",
            "  https://github.com/QuAndy2016/SerialDesk"
          )
          $lines -join "`r`n" | Set-Content -Path "$pkg\使用说明.txt" -Encoding UTF8

          Compress-Archive -Path $pkg -DestinationPath "dist\$name-win64.zip" -Force
          $hash = (Get-FileHash "dist\$name-win64.zip" -Algorithm SHA256).Hash
          "$hash  $name-win64.zip" | Set-Content -Path "dist\$name-win64.zip.sha256" -Encoding ASCII
          Write-Host "Packaged dist\$name-win64.zip"

      - name: Build the Windows installer (Inno Setup, )
        # 2026-10-03: build it on every push so a broken .iss is caught before a
        # release - the installer compile only ran on tags, so edits went unverified.
        # Only "Publish GitHub Release" below stays tag-only.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $ver = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyVersion=$ver" "installer\SerialDesk.iss"
          $setup = "dist\SerialDesk_v$ver-win64-setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "installer was not produced"; exit 1 }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "$hash  SerialDesk_v$ver-win64-setup.exe" | Set-Content -Path "$setup.sha256" -Encoding ASCII
          Get-Item $setup | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialDesk-${{ steps.ver.outputs.version }}-win64
          path: |
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64.zip
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64.zip.sha256
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64-setup.exe
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64-setup.exe.sha256
          if-no-files-found: ignore
          retention-days: 30

      - name: Show build output
        run: |
          Get-ChildItem dist\ -Name
          Get-ChildItem "dist\SerialDesk_v${{ steps.ver.outputs.version }}" -Name

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: SerialDesk v${{ steps.ver.outputs.version }}
          files: |
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64.zip
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64.zip.sha256
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64-setup.exe
            dist/SerialDesk_v${{ steps.ver.outputs.version }}-win64-setup.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
