[pytest]
# Collect the project's own suite - and only that.
#
# Without this, pytest walks the whole tree. That is fine while every extra directory is
# ignored, but the moment anything vendored lands inside the checkout its bundled tests join
# the run: installing pip-audit under a local cache directory added 89 foreign tests (boolean,
# certifi) to the gate and inflated the reported count from 237 to 352.
testpaths = tests

# A spinning test must be diagnosed, not waited on.
#
# Ledger E-016: the suite hit a run where pytest never finished (one thread burned CPU
# for 250 s), and with the output piped into `Select-Object -Last N` the wait looked like
# total silence. This is pytest's own built-in watchdog: after N seconds it dumps every
# thread's traceback (so the spinning frame is printed) and keeps going, which turns a
# silent hang into a readable stack. The hard kill is the job of whoever launched pytest -
# `check_ui.py` now bounds its child, and `run_bounded.py` bounds ad-hoc runs.
faulthandler_timeout = 90
